<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="Omameh — Home hero wordmark lockup">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="#0A1840" stop-opacity="1"/>
      <stop offset="60%"  stop-color="#070F2A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#040A1F" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <!-- Navy ground with subtle radial glow centred behind wordmark -->
  <rect width="900" height="500" fill="url(#bg-glow)"/>

  <!-- Dashed concentric orbit rings (faint — echoes Triskelion outer orbit) -->
  <circle cx="450" cy="250" r="320" stroke="rgba(255,255,255,0.06)" stroke-width="0.75" stroke-dasharray="2 8" fill="none"/>
  <circle cx="450" cy="250" r="248" stroke="rgba(0,212,203,0.10)" stroke-width="0.75" stroke-dasharray="1 6" fill="none"/>
  <circle cx="450" cy="250" r="180" stroke="rgba(255,255,255,0.04)" stroke-width="0.5" stroke-dasharray="1 8" fill="none"/>

  <!-- Hero wordmark — split into three text runs so the middle "a" can be styled differently -->
  <!-- Anchored centred, baseline near y=290 -->
  <g font-family="'Playfair Display', Georgia, serif" font-size="200" font-weight="700" text-anchor="middle">
    <!-- The three runs render side-by-side. To keep them visually centred as one wordmark, we anchor each at its measured x-centre. -->
    <!-- "Om" — left of centre, cream -->
    <text x="291" y="295" fill="#F4F0E6">Om</text>
    <!-- "a" — centre, teal, italic -->
    <text x="448" y="295" fill="#00D4CB" font-style="italic">a</text>
    <!-- "meh" — right of centre, cream -->
    <text x="610" y="295" fill="#F4F0E6">meh</text>
  </g>

  <!-- EST. 2026 strip with flanking dashes, centred beneath wordmark at y=400 -->
  <!-- Left dash -->
  <line x1="356" y1="400" x2="396" y2="400" stroke="rgba(244,240,230,0.5)" stroke-width="1"/>
  <!-- Mono-caps text -->
  <text x="450" y="406" text-anchor="middle"
        font-family="'JetBrains Mono', ui-monospace, monospace"
        font-size="16" fill="rgba(244,240,230,0.72)"
        letter-spacing="8" font-weight="500">EST. 2026</text>
  <!-- Right dash -->
  <line x1="504" y1="400" x2="544" y2="400" stroke="rgba(244,240,230,0.5)" stroke-width="1"/>
</svg>
