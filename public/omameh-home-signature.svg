  <g class="om-spark om-spark-1"><line x1="200" y1="63" x2="200" y2="54" stroke="url(#om-comet)" stroke-width="2" stroke-linecap="round"></line><circle cx="200" cy="54" r="5" fill="#00D4CB"></circle></g>
  <g class="om-spark om-spark-2"><line x1="200" y1="63" x2="200" y2="54" stroke="url(#om-comet)" stroke-width="2" stroke-linecap="round"></line><circle cx="200" cy="54" r="5" fill="#00D4CB"></circle></g>
