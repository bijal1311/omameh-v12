    <line x1="200" y1="60" x2="200" y2="180" stroke="rgba(255,255,255,0.10)" stroke-width="0.75"/>

    <circle cx="394" cy="200" r="6.5" fill="#C9A84C" opacity="0.18"/>
    <circle cx="394" cy="200" r="3.5" fill="#C9A84C" opacity="0.92"/>
    <circle cx="200" cy="394" r="6.5" fill="#C9A84C" opacity="0.18"/>
    <circle cx="200" cy="394" r="3.5" fill="#C9A84C" opacity="0.92"/>
    <circle cx="6"   cy="200" r="6.5" fill="#C9A84C" opacity="0.18"/>
    <circle cx="6"   cy="200" r="3.5" fill="#C9A84C" opacity="0.92"/>

