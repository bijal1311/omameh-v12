      <path d="M 112.6,65 A 130,130 0 0,1 -112.6,65"     stroke="url(#g-white)" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.92"/>
      <path d="M -112.6,65 A 130,130 0 0,1 -22.57,-128.03" stroke="url(#g-gold)" stroke-width="14" stroke-linecap="round" fill="none"/>
